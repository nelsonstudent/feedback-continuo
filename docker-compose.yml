version: "3.8"
services:
  sias-api:
    build:
      context: ./app
    container_name: sias-api
    volumes:
      - ./app:/app
      - sias-db-data:/app/db
    ports:
      - "5000:5000"
    networks:
      - siasnet
    env_file:
      - ./app/.env
    environment:
      - FLASK_ENV=development

  sias-frontend:
    build:
      context: ./frontend/sias-app
    container_name: sias-frontend
    ports:
      - "3000:80"
    networks:
      - siasnet
    env_file:
      - ./frontend/sias-app/.env
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - sias-api

volumes:
  sias-db-data:

networks:
  siasnet:
    driver: bridge